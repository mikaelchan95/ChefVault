# RevenueCat sends a static Authorization header, not a Supabase JWT, so the
# gateway must not enforce JWT verification on this function.
[functions.revenuecat-webhook]
verify_jwt = false

# Authenticated users only (default); the app attaches the signed-in user's JWT.
[functions.import-recipe]
verify_jwt = true
