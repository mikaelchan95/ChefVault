name: ChefVault
options:
  bundleIdPrefix: com.chefvault
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"
targets:
  ChefVault:
    type: application
    platform: iOS
    sources:
      - path: ChefVault
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: ShareExtension
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: ChefVault/Info.generated.plist
      properties:
        CFBundleDisplayName: ChefVault
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REVENUECAT_PUBLIC_SDK_KEY: $(REVENUECAT_PUBLIC_SDK_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [chefvault]
        UIAppFonts:
          - BricolageGrotesque.ttf
          - HankenGrotesk.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chefvault.app
        CODE_SIGN_ENTITLEMENTS: ChefVault/ChefVault.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ChefVaultShared
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: "Build Kotlin shared framework (SKIE)"
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chefvault.app.ShareExtension
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    info:
      path: ShareExtension/Info.generated.plist
      properties:
        CFBundleDisplayName: Save to ChefVault
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
