<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff7b00",
                        "background-dark": "#0f0f0f",
                        "field-dark": "#1a1a1a",
                        "border-dark": "#2d2d2d"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Edit Recipe Workspace - ChefVault</title>
<style type="text/tailwindcss">
        body {
            min-height: max(884px, 100dvh);
        }.drag-handle-active {
            color: #ffffff !important;
            opacity: 1 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display text-slate-100 min-h-screen">
<div class="sticky top-0 z-50 flex items-center bg-background-dark/95 backdrop-blur-md border-b border-white/5 px-4 py-3 justify-between">
<div class="text-slate-100 flex size-10 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">Edit Recipe</h2>
<div class="flex size-10 items-center justify-end">
<button class="text-primary text-base font-bold leading-normal tracking-tight bg-transparent border-none">Done</button>
</div>
</div>
<main class="max-w-md mx-auto pb-32">
<section class="p-4 space-y-4">
<h3 class="text-primary text-xs font-black uppercase tracking-[0.1em]">Recipe Info</h3>
<div class="space-y-4">
<label class="flex flex-col w-full">
<p class="text-slate-400 text-xs font-bold mb-1.5 px-1">Recipe Title</p>
<input class="form-input w-full rounded-lg border-border-dark bg-field-dark text-slate-100 focus:ring-primary focus:border-primary h-12 text-base font-medium px-4" placeholder="e.g. Braised Short Ribs" type="text" value="Truffle Mushroom Risotto"/>
</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex flex-col">
<p class="text-slate-400 text-xs font-bold mb-1.5 px-1">Cuisine</p>
<select class="form-select w-full rounded-lg border-border-dark bg-field-dark text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm">
<option>Italian</option>
<option>French</option>
<option>Japanese</option>
</select>
</label>
<label class="flex flex-col">
<p class="text-slate-400 text-xs font-bold mb-1.5 px-1">Servings</p>
<input class="form-input w-full rounded-lg border-border-dark bg-field-dark text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm" type="number" value="4"/>
</label>
</div>
<div class="grid grid-cols-2 gap-3">
<label class="flex flex-col">
<p class="text-slate-400 text-xs font-bold mb-1.5 px-1">Prep Time (min)</p>
<input class="form-input w-full rounded-lg border-border-dark bg-field-dark text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm" type="text" value="15"/>
</label>
<label class="flex flex-col">
<p class="text-slate-400 text-xs font-bold mb-1.5 px-1">Cook Time (min)</p>
<input class="form-input w-full rounded-lg border-border-dark bg-field-dark text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm" type="text" value="35"/>
</label>
</div>
</div>
</section>
<section class="p-4 space-y-4">
<div class="flex items-center justify-between">
<h3 class="text-primary text-xs font-black uppercase tracking-[0.1em]">Ingredients</h3>
<button class="flex items-center gap-1 text-primary text-xs font-bold bg-primary/15 px-3 py-1.5 rounded-full border border-primary/20">
<span class="material-symbols-outlined text-sm">add</span> Add Row
            </button>
</div>
<div class="space-y-1 bg-field-dark rounded-xl border border-border-dark overflow-hidden">
<div class="flex items-center gap-2 group px-3 py-1 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-white/70 cursor-grab active:cursor-grabbing py-2">drag_indicator</span>
<input class="flex-1 min-w-0 border-none bg-transparent text-sm text-slate-100 focus:ring-0 px-1 py-3" placeholder="Item" type="text" value="Arborio Rice"/>
<input class="w-20 border-none bg-transparent text-sm text-right text-slate-300 focus:ring-0 px-1 py-3" placeholder="Qty" type="text" value="300g"/>
<span class="material-symbols-outlined text-slate-500 text-lg cursor-pointer opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity">delete</span>
</div>
<div class="h-px bg-border-dark mx-3"></div>
<div class="flex items-center gap-2 group px-3 py-1 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-white/70 cursor-grab active:cursor-grabbing py-2">drag_indicator</span>
<input class="flex-1 min-w-0 border-none bg-transparent text-sm text-slate-100 focus:ring-0 px-1 py-3" placeholder="Item" type="text" value="Chicken Stock"/>
<input class="w-20 border-none bg-transparent text-sm text-right text-slate-300 focus:ring-0 px-1 py-3" placeholder="Qty" type="text" value="1.2L"/>
<span class="material-symbols-outlined text-slate-500 text-lg cursor-pointer opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity">delete</span>
</div>
<div class="h-px bg-border-dark mx-3"></div>
<div class="flex items-center gap-2 group px-3 py-1 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-white/70 cursor-grab active:cursor-grabbing py-2">drag_indicator</span>
<input class="flex-1 min-w-0 border-none bg-transparent text-sm text-slate-100 focus:ring-0 px-1 py-3" placeholder="Item" type="text" value="Wild Mushrooms"/>
<input class="w-20 border-none bg-transparent text-sm text-right text-slate-300 focus:ring-0 px-1 py-3" placeholder="Qty" type="text" value="200g"/>
<span class="material-symbols-outlined text-slate-500 text-lg cursor-pointer opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity">delete</span>
</div>
</div>
</section>
<section class="p-4 space-y-4">
<div class="flex items-center justify-between">
<h3 class="text-primary text-xs font-black uppercase tracking-[0.1em]">Preparation Steps</h3>
<button class="flex items-center gap-1 text-primary text-xs font-bold bg-primary/15 px-3 py-1.5 rounded-full border border-primary/20">
<span class="material-symbols-outlined text-sm">add</span> Add Step
            </button>
</div>
<div class="space-y-6">
<div class="flex gap-4">
<div class="flex flex-col items-center">
<div class="size-7 rounded-full bg-primary text-white flex items-center justify-center text-sm font-black shadow-lg shadow-primary/20">1</div>
<div class="w-0.5 flex-1 bg-border-dark my-2"></div>
</div>
<div class="flex-1 space-y-3">
<textarea class="w-full border-border-dark rounded-lg bg-field-dark text-slate-100 text-sm focus:ring-primary focus:border-primary min-h-[100px] py-3 px-4 leading-relaxed" placeholder="Instruction detail...">Sauté mushrooms in butter until golden brown. Remove and set aside for finishing.</textarea>
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-xl">timer</span>
<input class="border-none bg-transparent text-xs text-primary font-bold p-0 focus:ring-0 w-24" type="text" value="8 minutes"/>
</div>
</div>
</div>
<div class="flex gap-4">
<div class="flex flex-col items-center">
<div class="size-7 rounded-full bg-primary text-white flex items-center justify-center text-sm font-black shadow-lg shadow-primary/20">2</div>
<div class="w-0.5 flex-1 bg-border-dark my-2"></div>
</div>
<div class="flex-1 space-y-3">
<textarea class="w-full border-border-dark rounded-lg bg-field-dark text-slate-100 text-sm focus:ring-primary focus:border-primary min-h-[100px] py-3 px-4 leading-relaxed" placeholder="Instruction detail...">Toast arborio rice in shallot and olive oil mixture until translucent at the edges.</textarea>
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-xl">timer</span>
<input class="border-none bg-transparent text-xs text-primary font-bold p-0 focus:ring-0 w-24" type="text" value="3 minutes"/>
</div>
</div>
</div>
<div class="flex gap-4">
<div class="flex flex-col items-center">
<div class="size-7 rounded-full bg-primary text-white flex items-center justify-center text-sm font-black shadow-lg shadow-primary/20">3</div>
<div class="w-0.5 flex-1 bg-transparent my-2"></div>
</div>
<div class="flex-1 space-y-3">
<textarea class="w-full border-border-dark rounded-lg bg-field-dark text-slate-100 text-sm focus:ring-primary focus:border-primary min-h-[100px] py-3 px-4 leading-relaxed" placeholder="Instruction detail...">Gradually add warm stock one ladle at a time, stirring constantly until liquid is absorbed.</textarea>
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-xl">timer</span>
<input class="border-none bg-transparent text-xs text-primary font-bold p-0 focus:ring-0 w-24" type="text" value="20 minutes"/>
</div>
</div>
</div>
</div>
</section>
</main>
<div class="fixed bottom-0 left-0 right-0 p-5 bg-background-dark/90 backdrop-blur-xl border-t border-white/5 flex justify-center max-w-md mx-auto z-50">
<button class="w-full bg-primary hover:bg-orange-500 text-white font-black py-4 rounded-xl shadow-2xl shadow-primary/40 transition-all active:scale-[0.98] uppercase tracking-wider text-sm">
        Save Recipe Changes
    </button>
</div>

</body></html>
