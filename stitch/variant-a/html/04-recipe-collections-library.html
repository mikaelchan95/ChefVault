<!DOCTYPE html>

<title>Recipe Collections Library</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff7b00",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23190f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<header class="sticky top-0 z-20 bg-background-light/80 dark:bg-background-dark/80 ios-blur px-4 pt-12 pb-4">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<div class="bg-primary p-1.5 rounded-lg text-white">
<span class="material-symbols-outlined text-2xl leading-none">restaurant_menu</span>
</div>
<h1 class="text-2xl font-bold tracking-tight">ChefVault</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-200/50 dark:bg-slate-800/50">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">account_circle</span>
</button>
</div>
<div class="flex items-center justify-between">

<span class="material-symbols-outlined">add_circle</span>

</div>

<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-slate-400">search</span>

</div>
</div>
</header>

</div>
<div class="p-3">
<h3 class="font-bold text-sm truncate">R&amp;D</h3>

<p class="text-xs text-slate-500 mt-0.5">85 recipes</p>
</div>
</div>

<span class="material-symbols-outlined text-slate-400 text-3xl mb-1">create_new_folder</span>
<span class="text-xs font-medium text-slate-500">Create Folder</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="absolute bottom-0 left-0 right-0 bg-background-light/90 dark:bg-background-dark/90 ios-blur border-t border-slate-200 dark:border-slate-800 px-6 pb-8 pt-3">
<div class="flex items-center justify-between">
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">menu_book</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Recipes</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">folder</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Collections</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Inventory</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Settings</span>
</a>
</div>
</nav>
<!-- FAB for Quick Add -->
<button class="absolute bottom-24 right-4 bg-primary text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-transform z-30">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</body></html>
