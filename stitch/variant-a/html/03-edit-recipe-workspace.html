<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff7b00",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23190f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Edit Recipe Workspace - ChefVault</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Top Navigation Bar -->
<div class="sticky top-0 z-50 flex items-center bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-b border-primary/10 px-4 py-3 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">Edit Recipe</h2>
<div class="flex size-10 items-center justify-end">
<button class="text-primary text-base font-bold leading-normal tracking-tight bg-transparent border-none">Done</button>
</div>
</div>
<main class="max-w-md mx-auto pb-24">
<!-- Recipe Info Section -->
<section class="p-4 space-y-4">
<h3 class="text-primary text-xs font-bold uppercase tracking-wider">Recipe Info</h3>
<div class="space-y-3">
<label class="flex flex-col w-full">
<p class="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-1">Recipe Title</p>
<input class="form-input w-full rounded-lg border-primary/20 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-primary focus:border-primary h-12 text-base font-medium px-3" placeholder="e.g. Braised Short Ribs" type="text" value="Truffle Mushroom Risotto"/>
</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex flex-col">
<p class="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-1">Cuisine</p>
<select class="form-select w-full rounded-lg border-primary/20 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm">
<option>Italian</option>
<option>French</option>
<option>Japanese</option>
</select>
</label>
<label class="flex flex-col">
<p class="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-1">Servings</p>
<input class="form-input w-full rounded-lg border-primary/20 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm" type="number" value="4"/>
</label>
</div>
<div class="grid grid-cols-2 gap-3">
<label class="flex flex-col">
<p class="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-1">Prep Time (min)</p>
<input class="form-input w-full rounded-lg border-primary/20 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm" type="text" value="15"/>
</label>
<label class="flex flex-col">
<p class="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-1">Cook Time (min)</p>
<input class="form-input w-full rounded-lg border-primary/20 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-primary focus:border-primary h-12 text-sm" type="text" value="35"/>
</label>
</div>
</div>
</section>
<!-- Ingredients Section -->
<section class="p-4 space-y-4">
<div class="flex items-center justify-between">
<h3 class="text-primary text-xs font-bold uppercase tracking-wider">Ingredients</h3>
<button class="flex items-center gap-1 text-primary text-xs font-bold bg-primary/10 px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-sm">add</span> Add Row
                </button>
</div>
<div class="space-y-1">
<!-- Ingredient Row 1 -->
<div class="flex items-center gap-2 group">
<span class="material-symbols-outlined text-slate-400 cursor-grab">drag_indicator</span>
<input class="flex-1 min-w-0 border-none bg-transparent text-sm focus:ring-0 px-1 py-2" placeholder="Item" type="text" value="Arborio Rice"/>
<input class="w-16 border-none bg-transparent text-sm text-right focus:ring-0 px-1 py-2" placeholder="Qty" type="text" value="300g"/>
<span class="material-symbols-outlined text-slate-400 text-sm cursor-pointer opacity-0 group-hover:opacity-100">delete</span>
</div>
<div class="h-px bg-primary/10 w-full"></div>
<!-- Ingredient Row 2 -->
<div class="flex items-center gap-2 group">
<span class="material-symbols-outlined text-slate-400 cursor-grab">drag_indicator</span>
<input class="flex-1 min-w-0 border-none bg-transparent text-sm focus:ring-0 px-1 py-2" placeholder="Item" type="text" value="Chicken Stock"/>
<input class="w-16 border-none bg-transparent text-sm text-right focus:ring-0 px-1 py-2" placeholder="Qty" type="text" value="1.2L"/>
<span class="material-symbols-outlined text-slate-400 text-sm cursor-pointer opacity-0 group-hover:opacity-100">delete</span>
</div>
<div class="h-px bg-primary/10 w-full"></div>
<!-- Ingredient Row 3 -->
<div class="flex items-center gap-2 group">
<span class="material-symbols-outlined text-slate-400 cursor-grab">drag_indicator</span>
<input class="flex-1 min-w-0 border-none bg-transparent text-sm focus:ring-0 px-1 py-2" placeholder="Item" type="text" value="Wild Mushrooms"/>
<input class="w-16 border-none bg-transparent text-sm text-right focus:ring-0 px-1 py-2" placeholder="Qty" type="text" value="200g"/>
<span class="material-symbols-outlined text-slate-400 text-sm cursor-pointer opacity-0 group-hover:opacity-100">delete</span>
</div>
<div class="h-px bg-primary/10 w-full"></div>
</div>
</section>
<!-- Preparation Steps Section -->
<section class="p-4 space-y-4">
<div class="flex items-center justify-between">
<h3 class="text-primary text-xs font-bold uppercase tracking-wider">Preparation Steps</h3>
<button class="flex items-center gap-1 text-primary text-xs font-bold bg-primary/10 px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-sm">add</span> Add Step
                </button>
</div>
<div class="space-y-6">
<!-- Step 1 -->
<div class="flex gap-4">
<div class="flex flex-col items-center">
<div class="size-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold">1</div>
<div class="w-px flex-1 bg-primary/20 my-2"></div>
</div>
<div class="flex-1 space-y-2">
<textarea class="w-full border-primary/20 rounded-lg bg-white dark:bg-slate-800 text-sm focus:ring-primary focus:border-primary min-h-[80px]" placeholder="Instruction detail...">Sauté mushrooms in butter until golden brown. Remove and set aside for finishing.</textarea>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">timer</span>
<input class="border-none bg-transparent text-xs text-primary font-bold p-0 focus:ring-0 w-20" type="text" value="8 minutes"/>
</div>
</div>
</div>
<!-- Step 2 -->
<div class="flex gap-4">
<div class="flex flex-col items-center">
<div class="size-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold">2</div>
<div class="w-px flex-1 bg-primary/20 my-2"></div>
</div>
<div class="flex-1 space-y-2">
<textarea class="w-full border-primary/20 rounded-lg bg-white dark:bg-slate-800 text-sm focus:ring-primary focus:border-primary min-h-[80px]" placeholder="Instruction detail...">Toast arborio rice in shallot and olive oil mixture until translucent at the edges.</textarea>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">timer</span>
<input class="border-none bg-transparent text-xs text-primary font-bold p-0 focus:ring-0 w-20" type="text" value="3 minutes"/>
</div>
</div>
</div>
<!-- Step 3 -->
<div class="flex gap-4">
<div class="flex flex-col items-center">
<div class="size-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold">3</div>
<div class="w-px flex-1 bg-primary/20 my-2 invisible"></div>
</div>
<div class="flex-1 space-y-2">
<textarea class="w-full border-primary/20 rounded-lg bg-white dark:bg-slate-800 text-sm focus:ring-primary focus:border-primary min-h-[80px]" placeholder="Instruction detail...">Gradually add warm stock one ladle at a time, stirring constantly until liquid is absorbed.</textarea>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg">timer</span>
<input class="border-none bg-transparent text-xs text-primary font-bold p-0 focus:ring-0 w-20" type="text" value="20 minutes"/>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Save Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-lg border-t border-primary/10 flex justify-center max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-95">
            Save Recipe Changes
        </button>
</div>
</body></html>
